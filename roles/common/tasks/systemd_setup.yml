---
# Setup SystemD Service for Roboshop Component

- name: Copy systemd service file
  template:
    src: "{{ component }}.service"
    dest: /etc/systemd/system/{{ component }}.service

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Start Service
  ansible.builtin.systemd_service:
    name: "{{ component }}"
    state: restarted
    enabled: yes
    daemon_reload: yes